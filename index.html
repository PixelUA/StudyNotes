<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Neon.io Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --mouse-x: 50%;
            --mouse-y: 50%;
        }

        body {
            background-color: #080810;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #ffffff;
            position: relative;
            cursor: none; /* Ховаємо стандартний курсор, бо гравець сам є курсором */
        }

        /* Футуристична сітка */
        body::before {
            content: '';
            position: absolute;
            inset: 0;
            background-image: 
                linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            z-index: 1;
        }

        /* Динамічний ліхтарик за мишкою */
        .spotlight {
            position: absolute;
            inset: 0;
            background: radial-gradient(
                600px circle at var(--mouse-x) var(--mouse-y),
                rgba(99, 102, 241, 0.12) 0%,
                rgba(168, 85, 247, 0.05) 40%,
                transparent 70%
            );
            z-index: 2;
            pointer-events: none;
        }

        /* Ігрове полотно */
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 3;
        }

        /* Рахунок у кутку екрана */
        .score-board {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 1.5rem;
            font-weight: 700;
            z-index: 10;
            background: rgba(255, 255, 255, 0.03);
            padding: 10px 20px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(5px);
            pointer-events: none;
            letter-spacing: 1px;
        }

        /* Картка Game Over (зберігає оригінальний стиль) */
        .card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 3rem;
            border-radius: 24px;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            text-align: center;
            max-width: 450px;
            width: 90%;
            z-index: 100;
            position: relative;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            transition: transform 0.2s ease, opacity 0.5s ease;
            display: none; /* З'являється тільки при програші */
            opacity: 0;
        }

        .card.show {
            display: block;
            opacity: 1;
        }

        .card::before {
            content: '';
            position: absolute;
            inset: -1px;
            border-radius: 24px;
            background: radial-gradient(
                300px circle at var(--mouse-x) var(--mouse-y),
                rgba(255, 255, 255, 0.2),
                transparent 60%
            );
            z-index: -1;
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask-composite: exclude;
            -webkit-mask-composite: xor;
            pointer-events: none;
        }

        .card h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            background: linear-gradient(45deg, #ef4444, #f97316);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
        }

        .card p {
            color: #94a3b8;
            font-size: 1.2rem;
            line-height: 1.6;
            margin-bottom: 10px;
        }

        .final-score {
            font-size: 2rem;
            font-weight: 800;
            color: #6366f1;
            margin: 15px 0;
            text-shadow: 0 0 15px rgba(99, 102, 241, 0.5);
        }

        .btn {
            margin-top: 1.5rem;
            padding: 0.8rem 2rem;
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .btn:hover {
            background: white;
            color: #080810;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.4);
            border-color: white;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <div class="spotlight"></div>
    <div class="score-board">SCORE: <span id="score">0</span></div>

    <!-- Полотно для гри -->
    <canvas id="gameCanvas"></canvas>

    <!-- Вікно Game Over -->
    <div class="card" id="gameOverCard">
        <h1>GAME OVER</h1>
        <p>Твій результат:</p>
        <div class="final-score" id="finalScore">0</div>
        <button class="btn" id="restartBtn">ЗІГРАТИ ЗНОВУ</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const root = document.documentElement;
        const scoreElement = document.getElementById('score');
        const finalScoreElement = document.getElementById('finalScore');
        const gameOverCard = document.getElementById('gameOverCard');
        const restartBtn = document.getElementById('restartBtn');

        // Встановлюємо розмір canvas під екран
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // Координати миші
        let mouse = { x: window.innerWidth / 2, y: window.innerHeight / 2 };
        
        window.addEventListener('mousemove', (e) => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
            // Передаємо в CSS для ефекту підсвічування рамки картки та фону
            root.style.setProperty('--mouse-x', `${e.clientX}px`);
            root.style.setProperty('--mouse-y', `${e.clientY}px`);
        });

        // Паралакс ефект для картки Game Over
        window.addEventListener('mousemove', (e) => {
            if(gameOverCard.classList.contains('show')) {
                const xAxis = (window.innerWidth / 2 - e.clientX) / 45;
                const yAxis = (window.innerHeight / 2 - e.clientY) / 45;
                gameOverCard.style.transform = `rotateY(${xAxis}deg) rotateX(${-yAxis}deg)`;
            }
        });

        // Ігрові змінні
        let player;
        let foods = [];
        let enemies = [];
        let score = 0;
        let isGameOver = false;

        const FOOD_COUNT = 40;
        let ENEMY_COUNT = 5;

        // Клас Гравця
        class Player {
            constructor() {
                this.x = window.innerWidth / 2;
                this.y = window.innerHeight / 2;
                this.radius = 15;
                this.color = '#6366f1';
                this.speed = 0.08; // Коефіцієнт плавності руху (інерція)
            }

            update() {
                // Плавне слідування за курсором (Linear Interpolation)
                this.x += (mouse.x - this.x) * this.speed;
                this.y += (mouse.y - this.y) * this.speed;
            }

            draw() {
                ctx.save();
                ctx.shadowBlur = 20;
                ctx.shadowColor = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
                ctx.restore();
            }
        }

        // Клас їжі (маси)
        class Food {
            constructor() {
                this.reset();
            }

            reset() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.radius = Math.random() * 4 + 3;
                // Рандомні неонові кольори
                const colors = ['#a855f7', '#ec4899', '#3b82f6', '#10b981', '#f59e0b'];
                this.color = colors[Math.floor(Math.random() * colors.length)];
            }

            draw() {
                ctx.save();
                ctx.shadowBlur = 10;
                ctx.shadowColor = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
                ctx.restore();
            }
        }

        // Клас ворогів (червоні кульки)
        class Enemy {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.radius = Math.random() * 12 + 8;
                this.color = '#ef4444';
                // Випадковий напрямок руху
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 2 + 1.5;
                this.dx = Math.cos(angle) * speed;
                this.dy = Math.sin(angle) * speed;
            }

            update() {
                this.x += this.dx;
                this.y += this.dy;

                // Відбивання від стін
                if (this.x - this.radius < 0 || this.x + this.radius > canvas.width) this.dx *= -1;
                if (this.y - this.radius < 0 || this.y + this.radius > canvas.height) this.dy *= -1;
            }

            draw() {
                ctx.save();
                ctx.shadowBlur = 15;
                ctx.shadowColor = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
                ctx.restore();
            }
        }

        // Старт/Рестарт гри
        function init() {
            score = 0;
            isGameOver = false;
            scoreElement.innerText = score;
            gameOverCard.classList.remove('show');
            document.body.style.cursor = 'none';

            player = new Player();
            foods = [];
            enemies = [];

            // Створюємо їжу
            for (let i = 0; i < FOOD_COUNT; i++) {
                foods.push(new Food());
            }

            // Створюємо перших ворогів
            for (let i = 0; i < ENEMY_COUNT; i++) {
                enemies.push(new Enemy());
            }
        }

        // Перевірка зіткнення двох кіл
        function getDistance(x1, y1, x2, y2) {
            return Math.hypot(x2 - x1, y2 - y1);
        }

        // Головний ігровий цикл (Анімація)
        function animate() {
            if (isGameOver) return;
            
            requestAnimationFrame(animate);
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Оновлення та малювання гравця
            player.update();
            player.draw();

            // Малювання їжі та перевірка на поїдання
            foods.forEach(food => {
                food.draw();
                
                let dist = getDistance(player.x, player.y, food.x, food.y);
                if (dist < player.radius + food.radius) {
                    food.reset();
                    score += 10;
                    scoreElement.innerText = score;
                    
                    // Гравець трішки росте від їжі
                    if(player.radius < 50) player.radius += 0.5;

                    // Кожні 100 очок додаємо нового ворога для ускладнення
                    if (score % 100 === 0) {
                        enemies.push(new Enemy());
                    }
                }
            });

            // Керування ворогами
            enemies.forEach(enemy => {
                enemy.update();
                enemy.draw();

                // Перевірка на зіткнення з ворогом (Game Over)
                let dist = getDistance(player.x, player.y, enemy.x, enemy.y);
                if (dist < player.radius + enemy.radius) {
                    endGame();
                }
            });
        }

        function endGame() {
            isGameOver = true;
            document.body.style.cursor = 'default';
            finalScoreElement.innerText = score;
            gameOverCard.classList.add('show');
        }

        restartBtn.addEventListener('click', () => {
            init();
            animate();
        });

        // Запуск гри при завантаженні
        init();
        animate();
    </script>
</body>
</html>
