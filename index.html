<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Інтерактивна Анімація</title>
    <style>
        /* Обнулення стандартних стилів */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --mouse-x: 50%;
            --mouse-y: 50%;
        }

        body {
            background-color: #080810;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #ffffff;
            position: relative;
        }

        /* Футуристична сітка на фоні */
        body::before {
            content: '';
            position: absolute;
            inset: 0;
            background-image: 
                linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            z-index: 1;
        }

        /* Динамічне неонове сяйво, що слідує за курсором */
        .spotlight {
            position: absolute;
            inset: 0;
            background: radial-gradient(
                600px circle at var(--mouse-x) var(--mouse-y),
                rgba(99, 102, 241, 0.15) 0%,
                rgba(168, 85, 247, 0.08) 40%,
                transparent 70%
            );
            z-index: 2;
            pointer-events: none;
        }

        /* Центральна картка з ефектом матового скла (Glassmorphism) */
        .card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 3rem;
            border-radius: 24px;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            text-align: center;
            max-width: 450px;
            z-index: 3;
            position: relative;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
            transition: transform 0.2s ease, border-color 0.3s ease;
        }

        /* Додаткове витончене підсвічування всередині картки від миші */
        .card::before {
            content: '';
            position: absolute;
            inset: -1px;
            border-radius: 24px;
            background: radial-gradient(
                300px circle at var(--mouse-x) var(--mouse-y),
                rgba(255, 255, 255, 0.2),
                transparent 60%
            );
            z-index: -1;
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask-composite: exclude;
            -webkit-mask-composite: xor;
            pointer-events: none;
        }

        .card h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            background: linear-gradient(45deg, #a855f7, #6366f1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .card p {
            color: #94a3b8;
            font-size: 1.1rem;
            line-height: 1.6;
        }

        /* Інтерактивна кнопка */
        .btn {
            margin-top: 2rem;
            padding: 0.8rem 2rem;
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
            font-size: 1rem;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .btn:hover {
            background: white;
            color: #080810;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.4);
            border-color: white;
            transform: translateY(-2px);
        }

        .btn:active {
            transform: translateY(0);
        }
    </style>
</head>
<body>

    <!-- Шар для відстеження сяйва -->
    <div class="spotlight"></div>

    <!-- Контент сторінки -->
    <div class="card">
        <h1>Привіт, Віталію!</h1>
        <p>Просто рухай мишкою по екрану. Фонові градієнти та грані цієї картки динамічно реагують на кожен твій рух.</p>
        <button class="btn">НАТИСНИ МЕНЕ</button>
    </div>

    <script>
        const root = document.documentElement;

        // Відстежуємо рух миші та передаємо координати в CSS змінні
        window.addEventListener('mousemove', (e) => {
            // Рахуємо позицію в пікселях відносно вікна
            root.style.setProperty('--mouse-x', `${e.clientX}px`);
            root.style.setProperty('--mouse-y', `${e.clientY}px`);
        });

        // Невеликий ефект нахилу картки (Parallax) для більшого об'єму
        const card = document.querySelector('.card');
        window.addEventListener('mousemove', (e) => {
            const xAxis = (window.innerWidth / 2 - e.clientX) / 45;
            const yAxis = (window.innerHeight / 2 - e.clientY) / 45;
            card.style.transform = `rotateY(${xAxis}deg) rotateX(${-yAxis}deg)`;
        });

        // Повертаємо картку в дефолтне положення, якщо мишка вийшла за межі екрану
        window.addEventListener('mouseleave', () => {
            card.style.transform = `rotateY(0deg) rotateX(0deg)`;
        });
    </script>
</body>
</html>
